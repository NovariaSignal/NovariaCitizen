<!doctype html>
<html lang="fr" class="page-app">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Connexion — Novaria Signal</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="app">
    <!-- TODO: point action at the real sign-in endpoint -->
    <form class="content content--auth" action="profil.html" method="post">
      <img class="logo" src="../assets/images/logo.png" alt="Novaria Signal" />
      <img class="hero" src="../assets/images/street.png" alt="" />

      <h1 class="page-title auth-title">Bon retour parmi nous.</h1>
      <p class="lead">Connectez-vous pour suivre vos signalements.</p>

      <nav class="segmented segmented--lg mt-20" aria-label="Authentification">
        <a href="connexion.html" aria-current="page">Connexion</a>
        <a href="inscription.html">Inscription</a>
      </nav>

      <div class="form-stack" style="margin-top:18px">
        <div class="field">
          <label class="label" for="email">Adresse e-mail</label>
          <div class="input input--tall">
            <svg class="i input__icon" width="18" height="18" viewBox="0 0 24 24" stroke-width="1.8" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="vous@exemple.com" required />
          </div>
          <span class="field__error">Veuillez saisir une adresse e-mail valide.</span>
        </div>

        <div class="field">
          <label class="label" for="password">Mot de passe</label>
          <div class="input input--tall">
            <svg class="i input__icon" width="18" height="18" viewBox="0 0 24 24" stroke-width="1.8" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Votre mot de passe" required />
            <!-- Show/hide password needs JavaScript; the icon is kept as a visual from the mockup. -->
            <svg class="i input__trail" width="18" height="18" viewBox="0 0 24 24" stroke-width="1.8" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
          </div>
        </div>

        <div class="row-between">
          <label class="check check--inline">
            <input type="checkbox" name="remember" checked />
            Rester connecté
          </label>
          <a href="#">Mot de passe oublié ?</a>
        </div>
      </div>

      <div class="actions-bottom actions-bottom--auth">
        <button class="btn btn--primary btn--lg btn--block" type="submit">
          Se connecter
          <svg class="i" width="16" height="16" viewBox="0 0 24 24" stroke-width="2" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
        <p class="foot-note">Pas encore de compte ? <a href="inscription.html">Créer un compte</a></p>
      </div>
    </form>
  </div>
</body>
</html>
