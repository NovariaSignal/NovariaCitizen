<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Novaria Signal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="icon" type="image/png" href="../assets/icons/favicon.ico">
</head>

<body>
  <div class="app">

    <header class="header">
      <a href="../index.html" class="logo" aria-label="Novaria Signal">
        <img src="../assets/images/logo.png" alt="Novaria Signal">
      </a>

      <nav class="topnav" aria-label="Desktop Navbar">
        <a href="../index.html">Accueil</a>
        <a href="all-reports.html">Signalements</a>
        <a href="report.html" class="topnav-cta">
          <i class="fa-regular fa-flag"></i>
          Signaler
        </a>
        <a href="login.html" class="topnav-profile active" aria-label="Profile">
          <i class="fa-regular fa-user"></i>
        </a>
      </nav>
    </header>

    <main class="auth">
      <section class="auth-panel">
        <h1 class="auth-title">Bon retour parmi nous.</h1>
        <p class="auth-lead">Connectez-vous pour suivre vos signalements.</p>

        <nav class="segmented" aria-label="Authentification">
          <a href="login.html" aria-current="page">Connexion</a>
          <a href="signup.html">Inscription</a>
        </nav>

        <!-- TODO: point action at the real sign-in endpoint (use method="post" then) -->
        <form class="auth-form" action="profile.html" method="get" novalidate>
          <div class="field">
            <label class="label" for="email">Adresse e-mail</label>
            <div class="input">
              <i class="fa-regular fa-envelope" aria-hidden="true"></i>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="vous@exemple.com" required aria-describedby="email-error">
            </div>
            <span class="field__error" id="email-error">Veuillez saisir une adresse e-mail valide.</span>
          </div>

          <div class="field">
            <label class="label" for="password">Mot de passe</label>
            <div class="input">
              <i class="fa-solid fa-lock" aria-hidden="true"></i>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Votre mot de passe" required aria-describedby="password-error">
              <button type="button" class="toggle-pw" aria-label="Afficher le mot de passe">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
            <span class="field__error" id="password-error">Veuillez saisir votre mot de passe.</span>
          </div>

          <div class="row-between">
            <label class="check">
              <input type="checkbox" name="remember" checked>
              <span>Rester connecté</span>
            </label>
            <a href="#" class="auth-link">Mot de passe oublié ?</a>
          </div>

          <button class="auth-submit" type="submit">
            <span>Se connecter</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>

        <p class="foot-note">Pas encore de compte ? <a href="signup.html">Créer un compte</a></p>
      </section>

      <div class="auth-photo">
        <img src="../assets/images/illustrations/cityimage.png" alt="">
      </div>
    </main>

    <nav class="tabbar" aria-label="Main navigation">
      <a href="../index.html" class="tab" aria-label="Home"><i class="fa-solid fa-house"></i></a>
      <a href="all-reports.html" class="tab" aria-label="Reports"><i class="fa-solid fa-list-check"></i></a>
      <a href="report.html" class="tab" aria-label="Report"><i class="fa-regular fa-flag"></i></a>
      <a href="login.html" class="tab active" aria-label="Profile"><i class="fa-regular fa-user"></i></a>
    </nav>

  </div>
  <script src="../js/auth.js"></script>
</body>
</html>
