<!doctype html>

    <header class="site-header">

      <nav class="main-nav" aria-label="Navigation principale">
        <a href="../index.html">Accueil</a>
        <a href="reports.html">Signalements</a>
        <a href="report.html">Signaler</a>
      </nav>
      <a class="login-link" href="login.html">
        <i class="fa-regular fa-user"></i> Connexion
      </a>
      <details class="menu-dropdown">
        <summary class="menu-toggle" aria-label="Ouvrir le menu">
          <i class="fa-solid fa-bars" aria-hidden="true"></i>

        <div class="header-menu">

            <a href="../index.html"><i class="fa-solid fa-house"></i> Accueil</a>

        <button class="button secondary" type="button" id="logout-button">

    <footer class="site-footer">

    <nav class="mobile-nav" aria-label="Navigation mobile">
      <a href="../index.html"><i class="fa-solid fa-house"></i><span>Accueil</span></a>
      <a href="reports.html"><i class="fa-solid fa-map"></i><span>Signalements</span></a>
