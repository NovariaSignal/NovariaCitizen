<!doctype html>
<html lang="fr" class="page-app">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Modifier le profil — Novaria Signal</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="topbar__logo" href="../index.html"><img src="../assets/images/logo.png" alt="Novaria Signal" /></a>
      <nav class="topbar__nav" aria-label="Navigation principale">
        <a href="../index.html">Accueil</a>
        <a href="all-reports.html">Signalements</a>
        <a class="topbar__cta" href="report.html"><svg class="i" width="16" height="16" viewBox="0 0 24 24" stroke-width="2" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></svg> Signaler</a>
        <a class="topbar__profile" href="profile.html" aria-label="Mon profil"><svg class="i" width="18" height="18" viewBox="0 0 24 24" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg></a>
      </nav>
    </header>
    <!-- TODO: point action at the real profile-update endpoint -->
    <form class="content content--padded" action="profile.html" method="post" enctype="multipart/form-data">
      <header class="subhead">
        <a class="icon-btn" href="profile.html" aria-label="Retour au profil">
          <svg class="i" width="20" height="20" viewBox="0 0 24 24" stroke-width="1.9" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        </a>
        <h1 class="subhead__title">Modifier le profil</h1>
      </header>

      <div class="photo-edit">
        <div class="photo-edit__wrap">
          <div class="avatar avatar--lg" aria-hidden="true">AL</div>
          <label class="photo-edit__badge" for="photo" aria-hidden="true">
            <svg class="i" width="14" height="14" viewBox="0 0 24 24" stroke-width="2"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
          </label>
        </div>
        <label class="photo-edit__link" for="photo">Changer la photo</label>
        <input class="sr-only" type="file" id="photo" name="photo" accept="image/*" />
      </div>

      <div class="card form-card mt-20">
        <div class="field">
          <label class="label" for="name">Nom complet <span class="req" aria-hidden="true">*</span></label>
          <div class="input"><input id="name" name="name" type="text" autocomplete="name" value="Amélie Laurent" required /></div>
        </div>
        <div class="field">
          <label class="label" for="email">Adresse e-mail <span class="req" aria-hidden="true">*</span></label>
          <div class="input"><input id="email" name="email" type="email" autocomplete="email" value="amelie.laurent@mail.com" required /></div>
          <span class="field__error">Veuillez saisir une adresse e-mail valide.</span>
        </div>
        <div class="field">
          <label class="label" for="phone">Téléphone</label>
          <div class="input">
            <span class="input__prefix">+230</span>
            <input id="phone" name="phone" type="tel" autocomplete="tel-national" value="5 712 34 56" placeholder="5 XXX XX XX" />
          </div>
        </div>
      </div>

      <div class="card menu mt-16">
        <a href="#">
          <svg class="i" width="18" height="18" viewBox="0 0 24 24" stroke-width="1.8" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span>Changer le mot de passe</span>
          <svg class="i chev" width="16" height="16" viewBox="0 0 24 24" stroke-width="2" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </a>
        <a href="login.html">
          <svg class="i" width="18" height="18" viewBox="0 0 24 24" stroke-width="1.8" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
          <span>Se déconnecter</span>
        </a>
        <a href="#" class="is-danger">
          <svg class="i" width="18" height="18" viewBox="0 0 24 24" stroke-width="1.8" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
          <span>Supprimer mon compte</span>
        </a>
      </div>

      <div class="actions-bottom">
        <button class="btn btn--primary btn--lg btn--block" type="submit">Enregistrer les modifications</button>
        <a class="btn btn--text" href="profile.html">Annuler</a>
      </div>
    </form>
  </div>
</body>
</html>
