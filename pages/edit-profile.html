<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f8fc" />
    <link rel="icon" href="../assets/icon/favicon.ico" type="image/x-icon" />
    <title>Modifier mon profil — Novaria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/profile.css" />
    <script src="../js/theme.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../index.html" aria-label="Novaria, accueil">
        <img class="brand-logo" src="../assets/logo.png" alt="Novaria" />
      </a>
      <nav class="main-nav" aria-label="Navigation principale">
        <a href="../index.html">Accueil</a>
        <a href="reports.html">Signalements</a>
        <a href="report.html">Signaler</a>
      </nav>
      <a class="login-link" href="login.html">
        <i class="fa-regular fa-user"></i> Connexion
      </a>
      <details class="menu-dropdown">
        <summary class="menu-toggle" aria-label="Ouvrir le menu">
          <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </summary>
        <div class="header-menu">
          <nav aria-label="Menu principal">
            <a href="../index.html"><i class="fa-solid fa-house"></i> Accueil</a>
            <a href="reports.html"><i class="fa-solid fa-map"></i> Signalements</a>
            <a href="report.html"><i class="fa-solid fa-pen-to-square"></i> Signaler</a>
            <a href="login.html"><i class="fa-regular fa-user"></i> Connexion</a>
          </nav>
          <div class="theme-options">
            <span>Thème</span>
            <div>
              <button type="button" data-theme-choice="light"><i class="fa-solid fa-sun"></i> Clair</button>
              <button type="button" data-theme-choice="dark"><i class="fa-solid fa-moon"></i> Sombre</button>
            </div>
          </div>
        </div>
      </details>
    </header>

    <main id="edit-profile" class="profile-page" hidden>
      <p class="eyebrow">VOTRE ESPACE</p>
      <h1>Modifier mon profil</h1>

      <form id="edit-profile-form" class="panel form-panel">
        <label for="name">Nom complet</label>
        <input id="name" autocomplete="name" required />
        <label for="email">Adresse e-mail</label>
        <input id="email" type="email" autocomplete="email" required />
        <label for="password">Nouveau mot de passe</label>
        <input
          id="password"
          type="password"
          autocomplete="new-password"
          minlength="4"
          placeholder="Laisser vide pour ne pas le changer"
        />
        <button class="button primary submit-button">
          <i class="fa-solid fa-check" aria-hidden="true"></i> Enregistrer
        </button>
        <a class="button secondary" href="profile.html">Annuler</a>
        <p class="form-message" id="edit-profile-message" role="status"></p>
      </form>
    </main>

    <footer class="site-footer">
      <a class="brand" href="../index.html" aria-label="Novaria, accueil">
        <img class="brand-logo" src="../assets/logo.png" alt="Novaria" />
      </a>
      <span>Une ville plus attentive, ensemble.</span>
      <span>© 2026 Ville de Novaria</span>
    </footer>
    <nav class="mobile-nav" aria-label="Navigation mobile">
      <a href="../index.html"><i class="fa-solid fa-house"></i><span>Accueil</span></a>
      <a href="reports.html"><i class="fa-solid fa-map"></i><span>Signalements</span></a>
      <a class="mobile-create" href="report.html"><i class="fa-solid fa-pen-to-square"></i><span>Signaler</span></a>
      <a class="active" href="profile.html"><i class="fa-regular fa-user"></i><span>Profil</span></a>
    </nav>

    <script src="../js/edit-profile.js" type="module"></script>
    <script src="../js/auth.js" type="module"></script>
  </body>
</html>
